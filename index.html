<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Daily Devotional</title>

  <meta name="theme-color" content="#1f2937">
  <link rel="manifest" href="manifest.json">

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f3f4f6;
      padding: 20px;
    }

    .app {
      max-width: 900px;
      margin: auto;
    }

    header {
      text-align: center;
      margin-bottom: 20px;
    }

    .calendar-box {
      background: white;
      padding: 15px;
      border-radius: 12px;
      margin-bottom: 20px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.08);
    }

    #calendarPicker {
      width: 100%;
      padding: 10px;
      border-radius: 8px;
      border: 1px solid #ddd;
      font-size: 16px;
    }

    .card {
      background: white;
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.08);
    }

    .date {
      color: #6b7280;
      margin-bottom: 10px;
      font-size: 14px;
    }

    audio {
      width: 100%;
      margin: 10px 0;
    }

    .btn {
      display: inline-block;
      padding: 10px 15px;
      background: #1f2937;
      color: white;
      text-decoration: none;
      border-radius: 8px;
    }

    .section {
      margin-top: 15px;
      padding: 15px;
      background: #f9fafb;
      border-left: 4px solid #1f2937;
      border-radius: 10px;
      white-space: pre-line;
    }
  </style>
</head>

<body>

<div class="app">

  <header>
    <h1>Daily Devotional</h1>
  </header>

  <div class="calendar-box">
    <label>Select Date</label>
    <input type="date" id="calendarPicker">
  </div>

  <div id="content">Loading...</div>

</div>

<script>

const FEED_URL = "https://api.allorigins.win/raw?url=" +
encodeURIComponent("https://api.experience.odb.org/devotionals/podcast/?country=US");

const devotionalMap = {};

async function loadFeed() {

  try {

    const res = await fetch(FEED_URL);
    const xmlText = await res.text();

    const xml = new DOMParser().parseFromString(xmlText, "text/xml");
    const items = xml.querySelectorAll("item");

    items.forEach(item => {

      const title = item.querySelector("title")?.textContent || "";
      const link = item.querySelector("link")?.textContent || "";
      const pubDate = item.querySelector("pubDate")?.textContent || "";
      const desc = item.querySelector("description")?.textContent || "";

      const enclosure = item.querySelector("enclosure");
      const audioUrl = enclosure ? enclosure.getAttribute("url") : null;

      const d = new Date(pubDate);
      const key = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;

      devotionalMap[key] = { title, link, pubDate, desc, audioUrl };

    });

    const picker = document.getElementById("calendarPicker");
    const dates = Object.keys(devotionalMap).sort().reverse();

    picker.max = dates[0];
    picker.min = dates[dates.length - 1];
    picker.value = dates[0];

    renderDevotional(dates[0]);

    picker.addEventListener("change", function () {
      renderDevotional(this.value);
    });

  } catch (e) {
    document.getElementById("content").innerHTML =
      "<div class='card'>Failed to load devotional</div>";
    console.error(e);
  }
}

function extractScripture(text) {
  const match = text.match(/([A-Z][a-z]+ \\d+:\\d+[-\\d:]*)/);
  return match ? match[1] : "";
}

function extractReflect(text) {
  const idx = text.toLowerCase().indexOf("reflect");
  if (idx === -1) return "";
  return text.substring(idx).replace(/<[^>]*>/g, "").trim();
}

function cleanText(text) {
  return text
    .replace(/<[^>]*>/g, "")
    .replace(/&ldquo;|&rdquo;/g, '"')
    .replace(/&rsquo;/g, "'");
}

function renderDevotional(dateKey) {

  const d = devotionalMap[dateKey];
  const content = document.getElementById("content");

  if (!d) {
    content.innerHTML = "<div class='card'>No devotional found</div>";
    return;
  }

  const scripture = extractScripture(d.desc);
  const reflect = extractReflect(d.desc);
  const clean = cleanText(d.desc);

  content.innerHTML = `
    <div class="card">

      <h3>Today's Scripture & Insight</h3>
      <h2>${scripture || d.title}</h2>

      <div class="date">${d.pubDate}</div>

      ${d.audioUrl ? `
        <audio controls>
          <source src="${d.audioUrl}" type="audio/mpeg">
        </audio>
      ` : ""}

      <div>${clean}</div>

      ${reflect ? `
        <div class="section">
          <strong>Reflect & Pray</strong>
          <div>${reflect}</div>
        </div>
      ` : ""}

      <br>

      <a class="btn" href="${d.link}" target="_blank">
        Read Full Devotional
      </a>

    </div>
  `;
}

loadFeed();

if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('service-worker.js');
}

</script>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="description" content="Daily Bread — Our Daily Bread devotionals with multilingual scripture">
  <meta name="theme-color" content="#1e3a5f">

  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Daily Bread">

  <title>Daily Bread</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon.svg">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div id="install-banner" class="install-banner hidden" role="region" aria-label="Install app">
    <span data-i18n="installPrompt">Install Daily Bread for offline reading</span>
    <button id="install-btn" type="button" data-i18n="install">Install</button>
    <button id="install-dismiss" type="button" aria-label="Dismiss">&times;</button>
  </div>

  <header class="app-header">
    <div class="header-top">
      <div class="brand">
        <img src="icons/icon.svg" alt="" width="36" height="36" class="brand-icon">
        <div>
          <h1 data-i18n="appTitle">Daily Bread</h1>
          <p class="subtitle" data-i18n="appSubtitle">Our Daily Bread Devotional</p>
        </div>
      </div>
      <div class="header-actions">
        <button id="theme-toggle" type="button" class="icon-btn" aria-label="Toggle theme">&#9788;</button>
        <button id="share-btn" type="button" class="icon-btn hidden" aria-label="Share">&#8599;</button>
      </div>
    </div>

    <div class="controls">
      <div class="control-group">
        <label for="lang-select" data-i18n="language">Language</label>
        <select id="lang-select" aria-label="Language">
          <option value="en">English</option>
          <option value="ur">&#1575;&#1585;&#1583;&#1608; (Urdu)</option>
          <option value="hi">&#2361;&#2367;&#2344;&#2381;&#2342;&#2368; (Hindi)</option>
        </select>
      </div>
      <div class="control-group">
        <label for="date-picker" data-i18n="selectDate">Select date</label>
        <input type="date" id="date-picker">
      </div>
      <button id="today-btn" type="button" class="secondary-btn" data-i18n="today">Today</button>
    </div>
  </header>

  <main id="main" class="main">
    <div id="status" class="status" role="status">
      <div class="spinner" aria-hidden="true"></div>
      <span data-i18n="loading">Loading today&apos;s devotional...</span>
    </div>
    <article id="devotional" class="devotional hidden" aria-live="polite"></article>
  </main>

  <footer class="app-footer">
    <p>
      <span data-i18n="sourceCredit">Devotional content from</span>
      <a href="https://odb.org" target="_blank" rel="noopener">Our Daily Bread Ministries</a>.
      <span data-i18n="urduCredit">Urdu scripture from</span>
      <a href="https://urdu-bible-api.vercel.app" target="_blank" rel="noopener">Urdu Bible API</a>.
    </p>
  </footer>

  <script type="module" src="js/app.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="description" content="Daily Bread (Roz Ki Roti) — Our Daily Bread devotionals with Urdu scripture">
  <meta name="theme-color" content="#8b6914">

  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Daily Bread">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,600;0,9..40,700;1,9..40,400&family=Noto+Nastaliq+Urdu:wght@400;600&display=swap" rel="stylesheet">

  <title>Daily Bread</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon.svg">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div id="install-banner" class="install-banner hidden" role="region" aria-label="Install app">
    <span data-i18n="installPrompt">Install Daily Bread for offline reading</span>
    <button id="install-btn" type="button" data-i18n="install">Install</button>
    <button id="install-dismiss" type="button" aria-label="Dismiss">&times;</button>
  </div>

  <header class="app-header">
    <div class="header-top">
      <div class="brand">
        <img src="icons/icon.svg" alt="" width="44" height="44" class="brand-icon">
        <div>
          <h1 data-i18n="appTitle">Daily Bread</h1>
          <p class="subtitle" data-i18n="appSubtitle">Our Daily Bread Devotional</p>
        </div>
      </div>
      <div class="header-actions">
        <button id="theme-toggle" type="button" class="icon-btn" aria-label="Toggle theme">&#9788;</button>
        <button id="share-btn" type="button" class="icon-btn hidden" aria-label="Share">&#8599;</button>
      </div>
    </div>

    <div class="controls">
      <div class="control-group">
        <label for="lang-select" data-i18n="language">Language</label>
        <select id="lang-select" aria-label="Language">
          <option value="en">English</option>
          <option value="ur">&#1575;&#1585;&#1583;&#1608; — Roz Ki Roti</option>
        </select>
      </div>
      <div class="control-group range-info">
        <span class="range-label" data-i18n="availableRange">Available devotionals</span>
        <span id="date-range" class="range-value">—</span>
      </div>
    </div>

    <div class="date-nav" aria-label="Date navigation">
      <button id="prev-day" type="button" class="nav-arrow" aria-label="Previous day">&#8249;</button>
      <div id="date-strip" class="date-strip" role="tablist"></div>
      <button id="next-day" type="button" class="nav-arrow" aria-label="Next day">&#8250;</button>
    </div>
    <button id="today-btn" type="button" class="today-btn" data-i18n="today">Today</button>
  </header>

  <main id="main" class="main">
    <div id="status" class="status" role="status">
      <div class="spinner" aria-hidden="true"></div>
      <span data-i18n="loading">Loading devotional...</span>
    </div>
    <article id="devotional" class="devotional hidden" aria-live="polite"></article>
  </main>

  <footer class="app-footer">
    <p>
      <span data-i18n="sourceCredit">Devotional content from</span>
      <a href="https://odb.org" target="_blank" rel="noopener">Our Daily Bread Ministries</a>.
      <span data-i18n="urduCredit">Urdu scripture from</span>
      <a href="https://urdu-bible-api.vercel.app" target="_blank" rel="noopener">Urdu Bible API</a>.
    </p>
  </footer>

  <script type="module" src="js/app.js"></script>
</body>
</html>
